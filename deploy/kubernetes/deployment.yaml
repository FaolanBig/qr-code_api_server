apiVersion: apps/v1
kind: Deployment
metadata:
  name: qr-code-api
  namespace: default
  labels:
    app.kubernetes.io/name: qr-code-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: qr-code-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qr-code-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/faolanbig/qr-code-api-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: qr-code-api
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: qr-code-api
                  key: api-key
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
