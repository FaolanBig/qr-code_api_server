apiVersion: v1
kind: ConfigMap
metadata:
  name: qr-code-api
  namespace: default
  labels:
    app.kubernetes.io/name: qr-code-api
data:
  LISTEN_ADDRESS: ":8080"
  READ_TIMEOUT: "10s"
  WRITE_TIMEOUT: "10s"
  IDLE_TIMEOUT: "60s"
  SHUTDOWN_TIMEOUT: "15s"
  FALLBACK_LOGO_PATH: "/app/assets/fallback-logo.png"
  LOGO_MAX_BYTES: "1048576"
